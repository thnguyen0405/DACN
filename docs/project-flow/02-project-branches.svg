<path d="M 865 1190 L 865 1245 L 290 1245 L 290 1160" fill="none" stroke="#153e32" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="524.0" y="1222" width="82" height="31" rx="5" fill="white"/>
<text x="565" y="1245" font-size="23" text-anchor="middle" fill="#153e32" font-weight="400">Không</text>
<path d="M 2070 1160 L 2070 1300 L 105 1300 L 105 1160" fill="none" stroke="#153e32" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1369.0" y="1277" width="322" height="31" rx="5" fill="white"/>
<text x="1530" y="1300" font-size="23" text-anchor="middle" fill="#153e32" font-weight="400">Tiếp tục trên cây hiện có</text>
<rect x="65" y="1350" width="1120" height="155" rx="16" fill="#f4f6fb"/>
<text x="89" y="1387" font-size="25" text-anchor="start" fill="#153e32" font-weight="700">TRIGGER MẶC ĐỊNH</text>
<text x="89" y="1423" font-size="23" text-anchor="start" fill="#465368" font-weight="400">Chọn một: mỗi 250 vòng lặp HOẶC thêm nút vào vùng mới.</text>
<text x="89" y="1453" font-size="23" text-anchor="start" fill="#465368" font-weight="400">Cooldown 100 vòng; tối đa 2 lần gọi thêm (kể cả lần lỗi).</text>
<text x="89" y="1483" font-size="23" text-anchor="start" fill="#465368" font-weight="400">Decay nếu bật: giảm điểm sau mỗi 20 nút trong vùng; không gọi LLM.</text>
<rect x="1215" y="1350" width="1120" height="155" rx="16" fill="#eef8f1"/>
<text x="1239" y="1387" font-size="25" text-anchor="start" fill="#153e32" font-weight="700">ĐÁNH GIÁ KẾT QUẢ</text>
<text x="1239" y="1423" font-size="23" text-anchor="start" fill="#465368" font-weight="400">Nhiều map × seed × planner × chế độ, cùng ngân sách.</text>
<text x="1239" y="1453" font-size="23" text-anchor="start" fill="#465368" font-weight="400">Success rate, thời gian nghiệm đầu, chiều dài, va chạm, chi phí API.</text>
<text x="1239" y="1483" font-size="23" text-anchor="start" fill="#465368" font-weight="400">reference.json: đường ngắn nhất trên lưới; không phải tối ưu liên tục.</text>
</g></svg>