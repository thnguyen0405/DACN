<g font-family="Arial, Helvetica, sans-serif">
<text x="65" y="65" font-size="39" text-anchor="start" fill="#153e32" font-weight="700">02  |  CÁC NHÁNH KHÁC VÀ THỬ NGHIỆM CỦA DỰ ÁN</text>
<text x="65" y="108" font-size="24" text-anchor="start" fill="#566477" font-weight="400">Các chế độ lấy mẫu là lựa chọn thay thế nhau; cập nhật điểm động chạy trong RRT Python riêng</text>
<text x="65" y="172" font-size="22" text-anchor="start" fill="#5145bd" font-weight="700">A. CÁC CHẾ ĐỘ LẤY MẪU TRONG ROS/C++</text>
<rect x="85.0" y="220.0" width="470" height="130" rx="13" fill="#e8f1ff" stroke="#e8f1ff" stroke-width="2"/>
<text x="320" y="266.0" font-size="27" text-anchor="middle" fill="#153e32" font-weight="600">Baseline: guidance_mode = none</text>
<text x="320" y="298.0" font-size="22" text-anchor="middle" fill="#38584c" font-weight="400">Không cần LLM / prior</text>
<text x="320" y="325.0" font-size="22" text-anchor="middle" fill="#38584c" font-weight="400">Sampler gốc của planner</text>
<rect x="85.0" y="430.0" width="470" height="130" rx="13" fill="#a9edc7" stroke="#a9edc7" stroke-width="2"/>
<text x="320" y="476.0" font-size="27" text-anchor="middle" fill="#153e32" font-weight="600">Điểm vùng hợp lệ</text>
<text x="320" y="508.0" font-size="22" text-anchor="middle" fill="#38584c" font-weight="400">LLM thật / heuristic / mock</text>
<text x="320" y="535.0" font-size="22" text-anchor="middle" fill="#38584c" font-weight="400">Ghi rõ nguồn điểm</text>
<rect x="700.0" y="430.0" width="480" height="130" rx="13" fill="#a9edc7" stroke="#a9edc7" stroke-width="2"/>
<text x="940" y="476.0" font-size="27" text-anchor="middle" fill="#153e32" font-weight="600">region_prior</text>
<text x="940" y="508.0" font-size="22" text-anchor="middle" fill="#38584c" font-weight="400">Chọn vùng theo trọng số</text>
<text x="940" y="535.0" font-size="22" text-anchor="middle" fill="#38584c" font-weight="400">Lấy điểm đều theo diện tích</text>
<rect x="85.0" y="690.0" width="470" height="130" rx="13" fill="#a9edc7" stroke="#a9edc7" stroke-width="2"/>
<text x="320" y="736.0" font-size="27" text-anchor="middle" fill="#153e32" font-weight="600">Chi phí các cạnh hiện có</text>
<text x="320" y="768.0" font-size="22" text-anchor="middle" fill="#38584c" font-weight="400">LLM hoặc heuristic hình học</text>
<text x="320" y="795.0" font-size="22" text-anchor="middle" fill="#38584c" font-weight="400">Kiểm tra ID và miền giá trị</text>
<rect x="700.0" y="690.0" width="480" height="130" rx="13" fill="#a9edc7" stroke="#a9edc7" stroke-width="2"/>
<text x="940" y="736.0" font-size="27" text-anchor="middle" fill="#153e32" font-weight="600">Dijkstra trên GCR</text>
<text x="940" y="768.0" font-size="22" text-anchor="middle" fill="#38584c" font-weight="400">Tối thiểu tổng edge cost</text>
<text x="940" y="795.0" font-size="22" text-anchor="middle" fill="#38584c" font-weight="400">Xuất chuỗi vùng start → goal</text>
<rect x="1295.0" y="615.0" width="430" height="120" rx="13" fill="#a9edc7" stroke="#a9edc7" stroke-width="2"/>
<text x="1510" y="656.0" font-size="27" text-anchor="middle" fill="#153e32" font-weight="600">sequence_guided</text>
<text x="1510" y="688.0" font-size="22" text-anchor="middle" fill="#38584c" font-weight="400">Vùng theo chuỗi + portal</text>
<text x="1510" y="715.0" font-size="22" text-anchor="middle" fill="#38584c" font-weight="400">Trộn lấy mẫu toàn cục</text>
<rect x="1295.0" y="805.0" width="430" height="110" rx="13" fill="#a9edc7" stroke="#a9edc7" stroke-width="2"/>
<text x="1510" y="854.5" font-size="27" text-anchor="middle" fill="#153e32" font-weight="600">corridor</text>
<text x="1510" y="886.5" font-size="22" text-anchor="middle" fill="#38584c" font-weight="400">Lấy mẫu trong hợp vùng tuyến</text>
<rect x="1910.0" y="420.0" width="420" height="150" rx="13" fill="#a9edc7" stroke="#a9edc7" stroke-width="2"/>
<text x="2120" y="462.5" font-size="27" text-anchor="middle" fill="#153e32" font-weight="600">Vòng lặp planner C++</text>
<text x="2120" y="494.5" font-size="22" text-anchor="middle" fill="#38584c" font-weight="400">Lấy mẫu → mở rộng cây</text>
<text x="2120" y="521.5" font-size="22" text-anchor="middle" fill="#38584c" font-weight="400">Kiểm tra va chạm → cập nhật</text>
<text x="2120" y="548.5" font-size="22" text-anchor="middle" fill="#38584c" font-weight="400">Xuất RViz + metrics</text>
