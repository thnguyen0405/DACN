<text x="1510" y="765" font-size="20" text-anchor="middle" fill="#576577" font-weight="400">Demo hỗn hợp: 80% guided / 20% global</text>
<text x="65" y="963" font-size="22" text-anchor="start" fill="#5145bd" font-weight="700">B. CẬP NHẬT ĐIỂM ĐỘNG — NGHIÊN CỨU PYTHON, CHƯA TÍCH HỢP ROS</text>
<rect x="80.0" y="1020.0" width="420" height="140" rx="13" fill="#a9edc7" stroke="#a9edc7" stroke-width="2"/>
<text x="290" y="1071.0" font-size="27" text-anchor="middle" fill="#153e32" font-weight="600">RRT Python đang chạy</text>
<text x="290" y="1103.0" font-size="22" text-anchor="middle" fill="#38584c" font-weight="400">Điểm ban đầu: llm_prior.json</text>
<text x="290" y="1130.0" font-size="22" text-anchor="middle" fill="#38584c" font-weight="400">Theo dõi vòng lặp, nút, vùng</text>
<polygon points="865,990.0 1040.0,1090 865,1190.0 690.0,1090" fill="#eaa5f6"/>
<text x="865" y="1069.0" font-size="26" text-anchor="middle" fill="#153e32" font-weight="600">Đến lúc</text>
<text x="865" y="1100.0" font-size="26" text-anchor="middle" fill="#153e32" font-weight="600">chấm lại?</text>
<text x="865" y="1131.0" font-size="20" text-anchor="middle" fill="#153e32" font-weight="400">Còn lượt gọi</text>
<rect x="1190.0" y="1020.0" width="480" height="140" rx="13" fill="#a9edc7" stroke="#a9edc7" stroke-width="2"/>
<text x="1430" y="1071.0" font-size="27" text-anchor="middle" fill="#153e32" font-weight="600">Gọi lại LLM</text>
<text x="1430" y="1103.0" font-size="22" text-anchor="middle" fill="#38584c" font-weight="400">Graph + vùng đã thăm + số nút</text>
<text x="1430" y="1130.0" font-size="22" text-anchor="middle" fill="#38584c" font-weight="400">Điểm hiện tại + nghiệm tốt nhất</text>
<rect x="1835.0" y="1020.0" width="470" height="140" rx="13" fill="#a9edc7" stroke="#a9edc7" stroke-width="2"/>
<text x="2070" y="1071.0" font-size="27" text-anchor="middle" fill="#153e32" font-weight="600">Áp dụng điểm mới</text>
<text x="2070" y="1103.0" font-size="22" text-anchor="middle" fill="#38584c" font-weight="400">Dùng cho mẫu tiếp theo</text>
<text x="2070" y="1130.0" font-size="22" text-anchor="middle" fill="#38584c" font-weight="400">Lỗi → giữ nguyên điểm cũ</text>
